name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { "1.0.0-ci.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Logic tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/Unit.ps1

      - name: Build NpsBypassSync.exe
        shell: pwsh
        run: ./build/Build.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: End-to-end test on NPS
        shell: powershell
        run: ./tests/E2E.ps1 -Exe "$PWD\dist\NpsBypassSync.exe" -WorkDir "$PWD\e2e"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NpsBypassSync-${{ steps.ver.outputs.version }}
          path: |
            dist/NpsBypassSync.exe
            e2e/shots/*.png

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NpsBypassSync.exe
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
