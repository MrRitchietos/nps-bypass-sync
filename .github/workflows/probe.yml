name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        shell: powershell
        run: ./tests/Probe.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe/
